<!DOCTYPE html>
<!-- video.html — Show de Prêmios — Versão 1.1
     Changelog:
     v1.1 (2026-06-28) — Adicionado suporte a vídeo local (.mp4) via play_local,
                          sem alterar o player do YouTube já existente
     v1.0 — Player YouTube via BroadcastChannel (play_video / parar_video)
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vídeos — Show de Prêmios</title>
<!-- Firebase (permite abrir esta tela em outro aparelho/rede e continuar
     sincronizada com o painel em tempo real) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="sirene.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }

  /* ── Tela de espera ── */
  .espera {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3vh;
    background: #000;
    transition: opacity .6s ease;
  }
  .espera.oculta { opacity: 0; pointer-events: none; }
  .espera-logo { font-size: 8vh; }
  .espera-titulo {
    font-size: clamp(18px, 3.5vh, 48px);
    font-weight: 700; color: #fff; text-align: center;
    text-shadow: 0 2px 12px rgba(0,0,0,.6);
  }
  .espera-sub { font-size: clamp(12px, 2vh, 24px); color: #555; }

  /* ── Player YouTube ── */
  #player-wrap {
    position: fixed; inset: 0; z-index: 5;
    background: #000; display: none;
  }
  #player-wrap.show { display: block; }
  #yt-player {
    width: 100%; height: 100%;
    border: none;
  }

  /* ── Player de vídeo local ── */
  #local-player-wrap {
    position: fixed; inset: 0; z-index: 5;
    background: #000; display: none;
  }
  #local-player-wrap.show { display: block; }
  #local-player {
    width: 100%; height: 100%;
    object-fit: contain;
  }

  /* ── Overlay de título (aparece no início) ── */
  .titulo-overlay {
    position: fixed; bottom: 6vh; left: 0; right: 0; z-index: 20;
    text-align: center; pointer-events: none;
    opacity: 0; transition: opacity .5s;
  }
  .titulo-overlay.show { opacity: 1; }
  .titulo-overlay .titulo-box {
    display: inline-block;
    background: rgba(0,0,0,.72);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 12px; padding: 10px 28px;
    font-size: clamp(14px, 2.8vh, 36px);
    font-weight: 700; color: #fff;
    text-shadow: 0 1px 6px rgba(0,0,0,.8);
    backdrop-filter: blur(6px);
  }
</style>
</head>
<body>

<!-- Tela de espera -->
<div class="espera" id="espera">
  <div class="espera-logo">🎬</div>
  <div class="espera-titulo">Aguardando vídeo…</div>
  <div class="espera-sub">O operador selecionará o vídeo pelo painel</div>
</div>

<!-- Player YouTube -->
<div id="player-wrap">
  <iframe id="yt-player" allowfullscreen
    allow="autoplay; fullscreen; accelerometer; gyroscope; picture-in-picture">
  </iframe>
</div>

<!-- Player de vídeo local (sem anúncios) -->
<div id="local-player-wrap">
  <video id="local-player" autoplay controls></video>
</div>

<!-- Overlay de título -->
<div class="titulo-overlay" id="titulo-overlay">
  <div class="titulo-box" id="titulo-texto"></div>
</div>

<script>
var CANAL_NOME = 'bingo-canal';
var tituloTimer = null;
/* Tela secundária sem som: abra video.html?mudo=1 (evita áudio duplicado quando há mais de uma tela de vídeo). */
var MUDO = /[?&]mudo=(1|sim|true)/i.test(location.search);

/* Áudio duplicado: se já existe outra tela de vídeo COM som aberta neste
   navegador, esta aba (a mais nova) se silencia sozinha. Só a primeira toca. */
try {
  var _telaId = Math.random().toString(36).slice(2);
  var _telaCanal = new BroadcastChannel('video-tela');
  _telaCanal.onmessage = function(e) {
    var m = e.data || {};
    if (m.id === _telaId) return;
    if (m.t === 'ping' && !MUDO) _telaCanal.postMessage({ t: 'pong', id: _telaId });
    if (m.t === 'pong' && !MUDO) {
      MUDO = true;
      var lp = document.getElementById('local-player'); if (lp) lp.muted = true;
      var yt = document.getElementById('yt-player');
      if (yt && yt.src && yt.src.indexOf('mute=1') < 0) yt.src += '&mute=1';
    }
  };
  _telaCanal.postMessage({ t: 'ping', id: _telaId });
} catch(err) {}

/* ── BroadcastChannel ── */
  function processarMensagemVideo(d) {
    if (!d) return;
    if (d.tipo === 'alerta_sirene') { Sirene.tratar(d); return; }
    if (d.tipo === 'trocar_tela') {
      var alvo = d.payload && d.payload.arquivo;
      var atual = location.pathname.split('/').pop() || 'index.html';
      if (alvo && alvo !== atual) { if (window.Sirene && Sirene.registrarTroca) Sirene.registrarTroca(atual, alvo, d); location.href = alvo + (MUDO && alvo.indexOf('?') < 0 ? '?mudo=1' : ''); }
      return;
    }

  if (d.tipo === 'play_video') {
    tocarVideo(d.payload.videoId, d.payload.titulo || '');
  }
  if (d.tipo === 'play_local') {
    tocarVideoLocal(d.payload.url, d.payload.titulo || '');
  }
  if (d.tipo === 'parar_video') {
    pararVideo();
  }
}

try {
  var canal = new BroadcastChannel(CANAL_NOME);
  canal.onmessage = function(e) {
    processarMensagemVideo(e && e.data);
  };
} catch(err) {
  console.warn('BroadcastChannel indisponível');
}

/* Firebase — sincronização entre aparelhos diferentes (ex.: esta tela
   aberta num monitor de outra sala). É um "extra" ao lado do
   BroadcastChannel; se falhar, a sincronização no mesmo computador
   continua funcionando normalmente. */
try {
  var firebaseConfig = {
    apiKey: "AIzaSyBPkvhBHOfZOzEqlukWgHRJnoDeYFrtj0I",
    authDomain: "show-de-premios-scj.firebaseapp.com",
    databaseURL: "https://show-de-premios-scj-default-rtdb.firebaseio.com",
    projectId: "show-de-premios-scj",
    storageBucket: "show-de-premios-scj.firebasestorage.app",
    messagingSenderId: "869902837867",
    appId: "1:869902837867:web:d690f79e6f916da672a92e"
  };
  firebase.initializeApp(firebaseConfig);
  firebase.auth().signInAnonymously().catch(function(e){
    console.warn('Falha no login anônimo do Firebase:', e);
  });
  var _fbJaConfigurado = false;
  firebase.auth().onAuthStateChanged(function(user){
    if (!user || _fbJaConfigurado) return;
    _fbJaConfigurado = true;
    var _fbUltimoTsVideo = null;
    var _fbPrimeira = true;
    firebase.database().ref('bingo/ultimaMensagem').on('value', function(snap) {
      var d = snap.val();
      /* A primeira leitura é só o estado guardado (a última mensagem, que pode
         ser um play_video antigo). Não é um comando novo: só memoriza. */
      if (_fbPrimeira) { _fbPrimeira = false; _fbUltimoTsVideo = d && d.ts; return; }
      if (!d || d.ts === _fbUltimoTsVideo) return;
      _fbUltimoTsVideo = d.ts;
      processarMensagemVideo(d);
    });
  });
} catch(e) {
  console.warn('Firebase indisponível — esta tela só sincroniza com abas do mesmo computador.', e);
}

/* ── Tocar vídeo do YouTube (já existente) ── */
var _ytUltimo = { id: '', em: 0 };
function tocarVideo(videoId, titulo) {
  if (!videoId) return;

  /* O mesmo comando chega pelo canal do navegador e pelo Firebase. Se o mesmo
     vídeo acabou de iniciar, ignora a cópia — senão o player reinicia. */
  var agora = Date.now();
  if (_ytUltimo.id === videoId && agora - _ytUltimo.em < 6000) return;
  _ytUltimo = { id: videoId, em: agora };

  pararVideoLocal();

  var src = 'https://www.youtube.com/embed/' + videoId
    + '?autoplay=1&controls=1&rel=0&modestbranding=1&enablejsapi=0' + (MUDO ? '&mute=1' : '');

  document.getElementById('yt-player').src = src;
  document.getElementById('player-wrap').classList.add('show');
  document.getElementById('espera').classList.add('oculta');

  mostrarTitulo(titulo);
}

/* ── Tocar vídeo local (sem anúncios) ── */
function tocarVideoLocal(url, titulo) {
  if (!url) return;

  /* para o YouTube se estiver tocando */
  document.getElementById('yt-player').src = '';
  document.getElementById('player-wrap').classList.remove('show');

  var player = document.getElementById('local-player');
  player.muted = MUDO;
  player.src = url;
  player.play().catch(function(){});

  document.getElementById('local-player-wrap').classList.add('show');
  document.getElementById('espera').classList.add('oculta');

  mostrarTitulo(titulo);
}

function pararVideoLocal() {
  var player = document.getElementById('local-player');
  player.pause();
  player.src = '';
  document.getElementById('local-player-wrap').classList.remove('show');
}

/* ── Mostra título por 5 segundos ── */
function mostrarTitulo(titulo) {
  if (!titulo) return;
  var ov = document.getElementById('titulo-overlay');
  document.getElementById('titulo-texto').textContent = titulo;
  ov.classList.add('show');
  clearTimeout(tituloTimer);
  tituloTimer = setTimeout(function() { ov.classList.remove('show'); }, 5000);
}

/* ── Parar qualquer vídeo ── */
function pararVideo() {
  _ytUltimo = { id: '', em: 0 };
  document.getElementById('yt-player').src = '';
  document.getElementById('player-wrap').classList.remove('show');
  pararVideoLocal();
  document.getElementById('espera').classList.remove('oculta');
  document.getElementById('titulo-overlay').classList.remove('show');
}

/* ── Tecla F — fullscreen ── */
document.addEventListener('keydown', function(e) {
  if (e.key === 'f' || e.key === 'F') {
    if (!document.fullscreenElement)
      document.documentElement.requestFullscreen().catch(function(){});
  }
  if (e.key === 'Escape') pararVideo();
});
</script>
</body>
</html>
